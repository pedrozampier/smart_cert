actor: AcceptanceTester
modules:
  enabled:
    - WebDriver:
        url: "http://app-host:80"  # Usando o alias e porta 80 (nginx)
        host: selenium  # Mantém como está
        port: 4444
        browser: chrome
        window_size: false
        capabilities:
          chromeOptions:
            args: ["--headless", "--no-sandbox", "--disable-dev-shm-usage"]
    - \Tests\Support\Helper\LoginHelper
